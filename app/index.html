 D.phase="done"}

function parseCsv(t){
 t=t.replace(/^﻿/,"");const rows=[];let row=[],cur="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
  else if(ch==='"')q=true;
  else if(ch===","||ch==="\t"||ch===";"){row.push(cur);cur=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()!==""))rows.push(row);row=[]}
  else cur+=ch}
 row.push(cur);if(row.some(x=>x.trim()!==""))rows.push(row);return rows}
function parseDue(s){
 s=(s||"").trim();let m,d,mo,y;const MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
 if(m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/)){y=+m[1];mo=+m[2];d=+m[3]}
 else if(m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/)){d=+m[1];mo=+m[2];y=+m[3]}
 else if(m=s.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s](\d{4})$/)){d=+m[1];mo=MON.indexOf(m[2].toLowerCase())+1;y=+m[3]}
 else return null;
 if(y!==2026||d<1||d>31)return null;
 return mo===10?d:mo===9?d-30:mo===11?d+31:null}
function resolveAgent(s){
 s=(s||"").trim().toLowerCase();if(!s)return null;
 return AGENTS.find(a=>a.id.toLowerCase()===s||a.login.toLowerCase()===s||a.name.toLowerCase()===s||a.name.toLowerCase().split(" ")[0]===s)||null}

 const idx={};
 if(hasHead){Object.keys(HMAP).forEach(k=>{const i=first.findIndex(x=>HMAP[k].includes(x));if(i>=0)idx[k]=i})}else{idx.loan=0;idx.agent=1}
 if(idx.loan==null||idx.agent==null)return{name,rows:[],badHead:true};
 const body=hasHead?raw.slice(1):raw,seen={},rows=[];
 body.forEach((r,i)=>{
  const g=k=>idx[k]!=null?(r[idx[k]]||"").trim():"";
  const o={n:i+(hasHead?2:1),loan:g("loan"),agentIn:g("agent"),status:"error",msg:"",L:null,agent:null,from:null};

    const L=LM[o.loan];

     else{
      const lang=LANGS.find(x=>x.toLowerCase()===g("lang").toLowerCase())||"Hindi",prod=["P1","P2","P3"].includes(g("prod").toUpperCase())?g("prod").toUpperCase():"P1";

  rows.push(o)});

 return '<div class="split"><div class="card q"><div class="ch"><div><h3>Campaign queue</h3><div class="sub2">my accounts in priority order</div></div></div>'+q+'</div><div>'+right+'</div></div>'}

function apply(k,t){
 const v=t.type==="checkbox"?t.checked:t.value,d=t.dataset,P=S.period,N=S.newCamp;
 switch(k){
  case"hour":S.hour=+v;break;

  case"tpl":S.tpl=v;break;

  case"ptpr":S.ptp.reason=v;break;
  case"cdisp":if(S.call)S.call.disp=v;break;
  case"cptpd":if(S.call)S.call.ptpDate=+v;break;
  case"cptpr":if(S.call)S.call.ptpReason=v;break;
  case"cnote":if(S.call)S.call.note=v;break;
  case"agentF":case"perfAgent":S.agentF=v;break;

  case"tgtC":AG(S.drillAgent).tgtCalls=Math.max(0,+v||0);break;
  case"tgtA":AG(S.drillAgent).tgtAmt=Math.max(0,+v||0);break;
  case"pfrom":P.mode="range";P.from=Math.max(1,Math.min(TODAY,+v||1));if(P.from>P.to)P.to=P.from;break;
  case"pto":P.mode="range";P.to=Math.max(1,Math.min(TODAY,+v||TODAY));if(P.to<P.from)P.from=P.to;break;
  case"pagent":S.prio.agent=v;break;

  case"pcrif":S.prio.crif=v;break;
  case"pq":S.prio.q=v;break;
  case"pvd":S.prevDraft=!!v;break;
  case"crifsrc":S.crifSrc=v;S.crifSel={};S.crifRun=null;break;

  case"ncag":{const i=N.agents.indexOf(d.v);if(v&&i<0)N.agents.push(d.v);if(!v&&i>=0)N.agents.splice(i,1);break}
  case"lagent":S.lf.agent=v;break;

document.addEventListener("change",e=>{
 const t=e.target,k=t.dataset&&t.dataset.in;if(!k||TEXTISH(t))return;
 apply(k,t);render()});

/* ----- ticker: call timer, dialer countdown, live agent simulation ----- */
setInterval(()=>{
 tickN++;if(!S.user)return;
 if(S.call&&S.call.phase==="conn"){S.call.secs++;const el=$("#clk");if(el)el.textContent=fmtT(S.call.secs);const pl=document.querySelector(".pill.call");if(pl)pl.textContent="☎ On call · "+LM[S.call.loan].name+" · "+fmtT(S.call.secs)}
 if(S.dial&&S.dial.phase==="count"&&!S.dial.paused){S.dial.count--;if(S.dial.count<=0){dialNext();render()}else{const el=$("#cnt");if(el)el.textContent=S.dial.count}}
 if(isMgr()){simTick();if(S.tab==="agents"&&!S.drillAgent&&subOf("agents","live")==="live"){const el=$("#live");if(el)el.outerHTML=liveHtml()}if(S.tab==="camps"){const f=$("#feed");if(f)f.innerHTML=feedHtml()}}
},1000);

render();

})();
