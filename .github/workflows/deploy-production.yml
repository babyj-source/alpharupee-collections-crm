name: Deploy to Production

# A version tag such as v1.0.0 deploys Production, after the required reviewers approve
# in the GitHub "production" environment. Only the tagged commit is deployed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Release tags must point at a commit merged to main."
            exit 1
          fi
      - name: CI must be green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=0
          for job in scripts backend frontend; do
            c="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" \
                 --jq "[.check_runs[] | select(.name==\"$job\")] | (max_by(.id) // {}) | .conclusion // \"missing\"")"
            echo "CI job $job: $c"
            [ "$c" = "success" ] || bad=1
          done
          if [ "$bad" = 1 ]; then
            echo "::error::CI has not passed on commit $GITHUB_SHA. Wait for the checks on main to go green, then tag again."
            exit 1
          fi
      - name: Calling-hours reminder
        run: |
          H="$(TZ=Asia/Kolkata date +%H)"
          if [ "$H" -ge 8 ] && [ "$H" -lt 19 ]; then
            echo "::warning::It is $(TZ=Asia/Kolkata date +%H:%M) IST, inside the 08:00-19:00 calling window. The restart drops agents' open screens for a few seconds. The approver should prefer to wait until after 19:00 unless this is urgent."
            echo "### Calling hours" >> "$GITHUB_STEP_SUMMARY"
            echo "This release was started at $(TZ=Asia/Kolkata date +%H:%M) IST, inside the calling window." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: verify
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
    secrets: inherit

  release-notes:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
