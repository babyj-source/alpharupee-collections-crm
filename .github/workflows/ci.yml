name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          for f in deploy/*.sh scripts/*.sh; do
            echo "checking $f"
            bash -n "$f"
          done

      # The steps below run only once the application has a package.json.
      # Add the equivalent steps for the chosen stack (Python, Java, ...) when it is decided.
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: hashFiles('package.json') != ''
        run: npm ci
      - name: Lint
        if: hashFiles('package.json') != ''
        run: npm run lint --if-present
      - name: Test
        if: hashFiles('package.json') != ''
        run: npm test --if-present
      - name: Build
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
